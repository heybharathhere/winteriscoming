<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Jalori Line — Winter Expedition</title>
<meta name="description" content="Offline-first field companion for the 9-day Himachal winter motorcycle expedition." />
<meta name="theme-color" content="#0F172A" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/favicon-32.png" />
<link rel="apple-touch-icon" href="icons/icon-apple-touch.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Jalori Line" />

<!-- Fonts: display (tactical), body, ATLA ink -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Cinzel:wght@500;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">

<!-- Tailwind (CDN) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-slate-950 text-slate-100 font-body antialiased overscroll-none">

<!-- ============ APP SHELL ============ -->
<div id="app" class="min-h-screen flex flex-col">

  <!-- Top bar -->
  <header class="app-header sticky top-0 z-40">
    <div class="flex items-center justify-between px-4 py-3">
      <div class="flex items-center gap-2">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" class="text-ice">
          <path d="M2 20L9 8L13 14L16 9L22 20H2Z" fill="currentColor" opacity="0.9"/>
          <circle cx="17" cy="5" r="2" fill="#FB923C"/>
        </svg>
        <div class="leading-tight">
          <h1 class="font-display tracking-wide text-lg text-slate-50">JALORI LINE</h1>
          <p class="text-[10px] uppercase tracking-[0.2em] text-slate-400 -mt-0.5">Winter Expedition · 18–26 Jan</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span id="connStatus" class="conn-pill" title="Connectivity">
          <span class="dot"></span><span class="txt">OFFLINE READY</span>
        </span>
        <button id="installBtn" class="hidden install-btn">Install</button>
      </div>
    </div>
    <!-- day progress rail -->
    <div id="dayRail" class="day-rail"></div>
  </header>

  <!-- Main view -->
  <main id="mainView" class="flex-1 pb-24 px-4 pt-4 max-w-2xl w-full mx-auto"></main>

  <!-- Bottom tab nav -->
  <nav class="tab-nav">
    <button class="tab-btn" data-tab="itinerary">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M5 4h14a1 1 0 011 1v14a1 1 0 01-1 1H5a1 1 0 01-1-1V5a1 1 0 011-1zm2 4v2h10V8H7zm0 4v2h10v-2H7zm0 4v2h6v-2H7z"/></svg>
      <span>Itinerary</span>
    </button>
    <button class="tab-btn" data-tab="checklist">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M9 11l-4 4-2-2 1.4-1.4L9 8.2l9.6-9.6L20 0z" transform="translate(0,2)"/><path fill="currentColor" d="M4 4h6v2H6v14h14v-4h2v6H4V4z"/></svg>
      <span>Checklist</span>
    </button>
    <button class="tab-btn" data-tab="field">
      <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path fill="currentColor" d="M13.5 13.5l-5 2.2 2.2-5 5-2.2z"/></svg>
      <span>Field</span>
    </button>
    <button class="tab-btn" data-tab="scroll">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M4 4a2 2 0 012-2h9l5 5v13a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm2 0v16h12V8h-5V4H6z"/></svg>
      <span>Scroll</span>
    </button>
    <button class="tab-btn" data-tab="journal">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 2l2.6 6.6L21 9l-5 4.4L17.5 20 12 16.6 6.5 20 8 13.4 3 9l6.4-.4z"/></svg>
      <span>Journal</span>
    </button>
  </nav>
</div>

<!-- ============ TEMPLATES ============ -->

<template id="tpl-day-card">
  <article class="day-card" data-day="">
    <button class="day-card__head">
      <div class="day-card__badge"></div>
      <div class="day-card__title-wrap">
        <p class="day-card__date"></p>
        <h3 class="day-card__title"></h3>
        <p class="day-card__route"></p>
      </div>
      <svg class="day-card__chev" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M8.6 4.6L18 12l-9.4 9.4-1.4-1.4L15.2 12 7.2 6z"/></svg>
    </button>
    <div class="day-card__body">
      <p class="day-card__desc"></p>
      <div class="day-card__meta"></div>
      <div class="day-card__stargazing"></div>
      <div class="day-card__links"></div>
      <button class="link-add-btn">+ Add booking / contact link</button>
    </div>
  </article>
</template>

<template id="tpl-link-chip">
  <a class="link-chip" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M3.9 12a5 5 0 015-5h3v2h-3a3 3 0 000 6h3v2h-3a5 5 0 01-5-5zm7-1h4v2h-4v-2zm3-4h3a5 5 0 010 10h-3v-2h3a3 3 0 000-6h-3V7z"/></svg>
    <span class="link-chip__label"></span>
    <button class="link-chip__del" title="Remove">×</button>
  </a>
</template>

<template id="tpl-checklist-item">
  <li class="check-item">
    <button class="check-box" aria-label="toggle">
      <svg viewBox="0 0 24 24" width="14" height="14"><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M4 12l5 5L20 6" class="check-tick"/></svg>
    </button>
    <span class="check-label">
      <span class="check-label__text"></span>
      <svg class="squiggle" viewBox="0 0 200 20" preserveAspectRatio="none"><path d="M2 10 Q 12 2, 22 10 T 42 10 T 62 10 T 82 10 T 102 10 T 122 10 T 142 10 T 162 10 T 182 10 T 200 10" /></svg>
    </span>
    <button class="check-del" title="Remove">×</button>
  </li>
</template>

<template id="tpl-gallery-item">
  <figure class="gallery-item">
    <img alt="" />
    <video muted playsinline></video>
    <figcaption></figcaption>
  </figure>
</template>

<template id="tpl-journal-entry">
  <article class="journal-entry">
    <div class="journal-entry__row">
      <span class="journal-entry__day"></span>
      <span class="journal-entry__time"></span>
      <span class="journal-entry__loc"></span>
    </div>
    <p class="journal-entry__note"></p>
  </article>
</template>

<!-- ============ MODALS ============ -->

<div id="modalRoot" class="modal-root" aria-hidden="true">
  <div class="modal-backdrop"></div>

  <div class="modal" id="modal-link" aria-hidden="true">
    <h3>Add link</h3>
    <label>Label<input id="linkLabelInput" type="text" placeholder="e.g. Homestay booking" maxlength="60" /></label>
    <label>URL<input id="linkUrlInput" type="url" placeholder="https://" /></label>
    <div class="modal__actions">
      <button class="btn-ghost" data-close>Cancel</button>
      <button class="btn-primary" id="linkSaveBtn">Save link</button>
    </div>
  </div>

  <div class="modal" id="modal-checklist-add" aria-hidden="true">
    <h3>Add packing item</h3>
    <label>Category
      <select id="checkCategorySelect">
        <option value="bike">Bike Spares</option>
        <option value="cold">Cold Weather Gear</option>
        <option value="docs">Documents</option>
        <option value="electronics">Electronics</option>
      </select>
    </label>
    <label>Item<input id="checkItemInput" type="text" placeholder="e.g. Spare clutch cable" maxlength="80" /></label>
    <div class="modal__actions">
      <button class="btn-ghost" data-close>Cancel</button>
      <button class="btn-primary" id="checkAddBtn">Add item</button>
    </div>
  </div>

  <div class="modal modal--wide" id="modal-journal-add" aria-hidden="true">
    <h3>New check-in</h3>
    <label>Day
      <select id="journalDaySelect"></select>
    </label>
    <label>Waypoint / location<input id="journalLocInput" type="text" placeholder="e.g. Raghupur Fort ridge" /></label>
    <label>Notes<textarea id="journalNoteInput" rows="3" placeholder="What happened, how it felt, conditions..."></textarea></label>
    <div class="modal__actions">
      <button class="btn-ghost" data-close>Cancel</button>
      <button class="btn-primary" id="journalSaveBtn">Log check-in</button>
    </div>
  </div>

  <div class="modal modal--wide" id="modal-lightbox" aria-hidden="true">
    <button class="lightbox-close" data-close>×</button>
    <div id="lightboxContent" class="lightbox-content"></div>
    <p id="lightboxCaption" class="lightbox-caption"></p>
  </div>
</div>

<input type="file" id="mediaFileInput" accept="image/*,video/*" capture="environment" multiple class="hidden" />

<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>
